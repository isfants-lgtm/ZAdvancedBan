
name: Build AdvancedPunish

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compilar plugin
        run: gradle build

      - name: Salvar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedPunish
          path: build/libs/*.jar
